name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mini-claude:
    name: mini_claude tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mini_claude/pyproject.toml
      - name: Install mini_claude
        run: python -m pip install -e './mini_claude[dev]'
      - name: Run mini_claude tests
        run: python -m pytest mini_claude/tests

  mini-claw:
    name: mini_claw tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mini_claude/pyproject.toml
            mini_claw/pyproject.toml
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -e ./mini_claude
          python -m pip install -e './mini_claw[dev]'
      - name: Run mini_claw tests
        run: python -m pytest mini_claw/tests

  packaging:
    name: Python package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            mini_claude/pyproject.toml
            mini_claw/pyproject.toml
      - run: python -m pip install build
      - run: python -m build --wheel mini_claude
      - run: python -m build --wheel mini_claw
      - name: Verify avatar presets are packaged
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("mini_claw/dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              presets = {
                  name.rsplit("/", 1)[-1]
                  for name in archive.namelist()
                  if "/avatar/presets/" in name and name.endswith(".yaml")
              }
          assert presets == {"coder.yaml", "general.yaml", "ops.yaml", "unified.yaml"}
          PY

  web:
    name: Web console build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_claw/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mini_claw/web/package-lock.json
      - run: npm ci
      - run: npm run build
